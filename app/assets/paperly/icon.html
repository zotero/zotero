<!doctype html>
<meta charset="utf-8">
<!--
	The Paperly app icon, drawn in a page so it can be re-rendered at any size
	from one source. build-icons.sh screenshots this with headless Chrome.

	Query: ?v=<look>&size=<px>&mode=mac|flat&fill=<0..1.5>&crisp=0

	The artwork is a 200x200 drawing with hard, aliased edges sitting on OPAQUE
	white -- and her shirt is white too, so no colour key can take the
	background without taking the shirt. Flood-filling inward from the border
	is what tells them apart: only the background touches the edge.
-->
<style>
	html, body { margin: 0; padding: 0; background: transparent; overflow: hidden }
	#stage { width: 1024px; height: 1024px; position: relative; transform-origin: top left }
</style>
<div id="stage"></div>
<script>
const q    = new URLSearchParams(location.search);
const V    = q.get("v") || "plum";
const SIZE = +(q.get("size") || 512);
const MODE = q.get("mode") || "mac";
// Apple leaves 100/1024 of air around the plate; every other platform draws
// the icon edge to edge.
const PAD  = MODE === "mac" ? 100 : 0;
const SIDE = 1024 - PAD * 2;
const FILL = +(q.get("fill") || 0.99);
const stage = document.getElementById("stage");
stage.style.transform = `scale(${SIZE / 1024})`;

// A superellipse, not a border-radius: Apple's corner is continuous, and the
// difference shows the moment the icon sits next to a system one.
function squircle(side, n = 5) {
	const r = side / 2, pts = [];
	for (let i = 0; i <= 360; i++) {
		const t = (i / 360) * 2 * Math.PI, c = Math.cos(t), s = Math.sin(t);
		pts.push(
			(r + Math.sign(c) * Math.pow(Math.abs(c), 2 / n) * r).toFixed(2) + "," +
			(r + Math.sign(s) * Math.pow(Math.abs(s), 2 / n) * r).toFixed(2));
	}
	return `path("M${pts.join(" L")} Z")`;
}
const CLIP = squircle(SIDE);

function cutout(img) {
	const c = document.createElement("canvas");
	c.width = c.height = 200;
	const g = c.getContext("2d", { willReadFrequently: true });
	g.drawImage(img, 0, 0);
	const d = g.getImageData(0, 0, 200, 200), p = d.data;
	// Only near-pure white goes. Her face is cream and stays well under this.
	const TOL = 244;
	const seen = new Uint8Array(200 * 200), stack = [];
	const push = (x, y) => {
		if (x >= 0 && y >= 0 && x < 200 && y < 200) { stack.push(y * 200 + x); }
	};
	for (let i = 0; i < 200; i++) { push(i, 0); push(i, 199); push(0, i); push(199, i); }
	while (stack.length) {
		const n = stack.pop();
		if (seen[n]) { continue; }
		seen[n] = 1;
		const i = n * 4;
		if (!(p[i] >= TOL && p[i + 1] >= TOL && p[i + 2] >= TOL)) { continue; }
		p[i + 3] = 0;
		const x = n % 200, y = (n - x) / 200;
		push(x - 1, y); push(x + 1, y); push(x, y - 1); push(x, y + 1);
	}
	g.putImageData(d, 0, 0);
	if (q.get("crisp") === "0") { return c; }
	// Whole-pixel upscale first, then let the browser come back down. A 4x
	// bilinear stretch of 200px art is mush; a downscale of a nearest copy is
	// not.
	const big = document.createElement("canvas");
	big.width = big.height = 1200;
	const bg = big.getContext("2d");
	bg.imageSmoothingEnabled = false;
	bg.drawImage(c, 0, 0, 1200, 1200);
	return big;
}

// plum is the shipped one: it holds her silhouette at 32px better than any of
// the light grounds, and its burgundy keeps a thread back to Zotero's red.
const looks = {
	plum:  { bg: "linear-gradient(168deg,#6B4257 0%,#4A2B3C 52%,#2E1A26 100%)",
	         glow: "rgba(255,214,228,.30)", shadow: "rgba(0,0,0,.45)" },
	cream: { bg: "linear-gradient(168deg,#FFFDF6 0%,#FBF0DC 44%,#F0DCBC 100%)",
	         glow: "rgba(255,255,255,.9)",  shadow: "rgba(140,100,60,.30)" },
	sage:  { bg: "linear-gradient(168deg,#F2F7F1 0%,#D8EADC 42%,#A8C9B6 100%)",
	         glow: "rgba(255,255,255,.9)",  shadow: "rgba(40,80,60,.30)" },
	rose:  { bg: "linear-gradient(168deg,#FFF1F4 0%,#FEDCE5 40%,#F6B7CA 100%)",
	         glow: "rgba(255,255,255,.85)", shadow: "rgba(150,60,90,.28)" },
};
const L = looks[V];

if (MODE === "mac") {
	const sh = document.createElement("div");
	Object.assign(sh.style, {
		position: "absolute", left: PAD + "px", top: PAD + "px",
		width: SIDE + "px", height: SIDE + "px", clipPath: CLIP,
		background: "#3A1F27", filter: `blur(${SIDE * 0.020}px)`, opacity: ".22",
		transform: `translateY(${SIDE * 0.020}px)`,
	});
	stage.appendChild(sh);
}

const plate = document.createElement("div");
Object.assign(plate.style, {
	position: "absolute", left: PAD + "px", top: PAD + "px",
	width: SIDE + "px", height: SIDE + "px",
	clipPath: CLIP, overflow: "hidden", background: L.bg,
});

// Light from below, not a halo behind her head -- a halo reads as a sticker
// someone cut out badly.
const glow = document.createElement("div");
Object.assign(glow.style, {
	position: "absolute", left: "-20%", bottom: "-42%", width: "140%", height: "96%",
	background: `radial-gradient(ellipse at 50% 100%,${L.glow} 0%,transparent 62%)`,
	opacity: ".55",
});
plate.appendChild(glow);

const img = new Image();
img.onload = () => {
	const c = cutout(img);
	const A = SIDE * FILL;
	Object.assign(c.style, {
		position: "absolute", left: "50%", bottom: -SIDE * 0.055 + "px",
		width: A + "px", height: A + "px", transform: "translateX(-50%)",
		filter: `drop-shadow(0 ${SIDE * 0.018}px ${SIDE * 0.026}px ${L.shadow})`,
	});
	plate.appendChild(c);

	const edge = document.createElement("div");
	Object.assign(edge.style, {
		position: "absolute", inset: "0", clipPath: CLIP,
		boxShadow: `inset 0 0 0 ${Math.max(1, SIDE * 0.005)}px rgba(90,40,60,.18)`,
	});
	plate.appendChild(edge);
	document.title = "ready";
};
img.src = "anya.png";
stage.appendChild(plate);
</script>
