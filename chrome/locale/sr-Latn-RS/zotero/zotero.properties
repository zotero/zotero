publications.intro.text1=Moje objave vam omogućuju da napravite spisak vaših radova i da ga podelite unutar vaše stranice na %S. Možete dodati beleške uz svaku stavku ili podeliti PDF i druge datoteke koristeći neku od licenca koju izaberete.
publications.intro.text2=Da dodate stavke, prevucite ih odnekud u vašu biblioteku. Možete izabrati da li da uključite priložene beleške ili datoteke.
publications.intro.text3=<b>Dodajte samo radove koje ste sami napravili</b>, i uključite samo datoteke za koje imate ovlašćenja i koje želite da delite javno.
