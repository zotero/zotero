standalone.corruptInstallation=Izgleda da je oštećena vaša instalacija Zotera zbog neuspelog ažuriranja. Iako Zotero može da nastaviti sa radom kako treba, bolje je da izbegnete moguće greške i preuzmite poslednju verziju Zotera sa stranice https://www.zotero.org/download što pre možete.
