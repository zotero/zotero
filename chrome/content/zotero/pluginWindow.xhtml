<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>

<!-- Minimal chrome wrapper for plugin content windows.
     The <browser> element loads plugin HTML with a content principal,
     enabling same-origin DOM access from the plugin sandbox. -->
<window xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
		xmlns:html="http://www.w3.org/1999/xhtml">

	<browser id="plugin-browser"
			 type="content"
			 flex="1"
			 remote="false"
			 disableglobalhistory="true"/>
</window>
