<svg xmlns="http://www.w3.org/2000/svg" width="188" height="36" viewBox="0 0 188 36">
  <title>Paperly</title>
  <!-- One fixed colour, like Zotero's own red was. A prefers-color-scheme
       query would follow the OS, not the app, and Zotero lets you choose
       light or dark independently of it -- so a dark-mode wordmark would land
       on a light dialog. This reads on both. -->
  <image x="0" y="2" width="32" height="32"
    href="data:image/png;base64,"/>
  <text fill="#C4667F" x="42" y="27" font-size="27" letter-spacing="-0.3"
    font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif">Paperly</text>
</svg>
